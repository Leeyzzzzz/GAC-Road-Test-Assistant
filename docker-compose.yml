version: '3.8'
name: kiwi-tcms

services:
  db:
    image: mariadb:10.11
    container_name: kiwi_db
    environment:
      MYSQL_DATABASE: kiwi
      MYSQL_USER: kiwi
      MYSQL_PASSWORD: kiwi
      MYSQL_ROOT_PASSWORD: kiwi
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kiwi_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u kiwi -pkiwi || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: kiwitcms/kiwi:latest
    container_name: kiwi_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      KIWI_DB_ENGINE: django.db.backends.mysql
      KIWI_DB_NAME: kiwi
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: kiwi
      KIWI_DB_HOST: db
      KIWI_DB_PORT: 3306
      KIWI_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      KIWI_ALLOWED_HOSTS: localhost,127.0.0.1
      KIWI_SITE_NAME: localhost:8443
      KIWI_LANGUAGE_CODE: zh-hans
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - kiwi_uploads:/Kiwi/uploads
    networks:
      - kiwi_network
    restart: unless-stopped

volumes:
  mysql_data:
  kiwi_uploads:

networks:
  kiwi_network:
